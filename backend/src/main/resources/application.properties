# Server Configuration
server.port=8080

# Database Configuration (MySQL)
# Note: For initial dev/startup without a DB, we could use H2, but we'll configure MySQL as requested
spring.datasource.url=jdbc:mysql://localhost:3306/procrop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Custom property to toggle mock vs real AI
ai.mock.enabled=true
